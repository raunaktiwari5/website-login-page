<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Modern Web App</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      max-width: 400px;
      width: 100%;
      border-radius: 1rem;
    }
  </style>
</head>
<body>

  <div class="container p-3">
    <div class="card login-card mx-auto shadow-lg border-0">
      <div class="card-body p-4 p-sm-5">
        
        <!-- Header -->
        <div class="text-center mb-4">
          <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-2">
            <i class="bi bi-person-fill fs-2"></i>
          </div>
          <h3 class="fw-bold text-dark">Welcome Back</h3>
          <p class="text-muted small">Sign in to continue to your account</p>
        </div>

        <!-- Form -->
        <form>
          <!-- Email Input -->
          <div class="mb-3">
            <label for="email" class="form-label text-secondary small fw-medium">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control bg-light border-start-0" id="email" placeholder="name@example.com" required>
            </div>
          </div>

          <!-- Password Input -->
          <div class="mb-3">
            <label for="password" class="form-label text-secondary small fw-medium">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control bg-light border-start-0" id="password" placeholder="••••••••" required>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe">
              <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
            </div>
            <a href="#" class="text-decoration-none small text-primary fw-medium">Forgot password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-2 mb-3">Sign In</button>

          <!-- Divider -->
          <div class="text-center text-muted small my-3">or continue with</div>

          <!-- Social Login -->
          <div class="d-flex gap-2 mb-3">
            <button type="button" class="btn btn-outline-secondary w-50 btn-sm py-2">
              <i class="bi bi-google me-1"></i> Google
            </button>
            <button type="button" class="btn btn-outline-secondary w-50 btn-sm py-2">
              <i class="bi bi-github me-1"></i> GitHub
            </button>
          </div>
        </form>

        <!-- Footer / Sign Up Link -->
        <div class="text-center mt-4">
          <p class="small text-muted mb-0">Don't have an account? <a href="#" class="text-primary text-decoration-none fw-semibold">Sign up</a></p>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

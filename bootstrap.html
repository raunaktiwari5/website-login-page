<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row g-4">
      
      <!-- Login Section -->
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Login</h3>
            <form onsubmit="return false;">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email Address</label>
                <input type="email" class="form-class form-control" id="loginEmail" placeholder="enter your email" required>
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="enter your password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Registration Section -->
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Register</h3>
            <form onsubmit="return false;">
              <div class="mb-3">
                <label for="regName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="regName" placeholder="enter your full name" required>
              </div>
              <div class="mb-3">
                <label for="regEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="regEmail" placeholder="enter your email" required>
              </div>
              <div class="mb-3">
                <label for="regPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="regPassword" placeholder="create a password" required>
              </div>
              <div class="mb-3">
                <label for="regConfirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="regConfirmPassword" placeholder="confirm password" required>
              </div>
              <button type="submit" class="btn btn-success w-100 mt-2">Register</button>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
